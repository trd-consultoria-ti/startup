version: "3.8"

services:
  trd_api:
    container_name: trd_evolution_api
    image: trd-evolution-api:latest
    restart: always
    ports:
      - "8085:8085"
    volumes:
      - ./instances:/evolution/instances
      - evolution-api_evolution_claude_sessions:/home/claudeuser/.claude
    networks:
      - evolution-net
    env_file:
      - .env
    environment:
      - SERVER_PORT=8085
      - SERVER_URL=http://localhost:8085
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution123@litellm-db:5432/evolution_db?schema=evolution_api
      - CACHE_REDIS_URI=redis://evolution_redis:6379/6
      - WHISPER_URL=http://evolution_whisper:9000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_KEY=1a81279f0ff24b36baebdbc29ebdc66a
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  evolution-net:
    external: true

volumes:
  evolution-api_evolution_claude_sessions:
    external: true
