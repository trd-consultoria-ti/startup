version: "3.8"

services:
  api:
    container_name: evolution_api
    build: .
    restart: always
    depends_on:
      - redis
      - evolution-postgres
      - whisper
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_claude_sessions:/home/claudeuser/.claude
    networks:
      - evolution-net
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_KEY=1a81279f0ff24b36baebdbc29ebdc66a
      - WHISPER_URL=http://whisper:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"

  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf
    networks:
      - evolution-net

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      evolution-net:
        aliases:
          - evolution-redis
    expose:
      - "6379"

  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: always
    env_file:
      - .env
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net
    expose:
      - "5432"

  whisper:
    container_name: evolution_whisper
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: always
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--host", "0.0.0.0", "--port", "9000", "-m", "/models/ggml-base.bin", "-l", "pt"]
    volumes:
      - evolution_whisper_models:/models
    networks:
      - evolution-net
    expose:
      - "9000"

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:
  evolution_claude_sessions:
  evolution_whisper_models:
    external: true

networks:
  evolution-net:
    name: evolution-net
    driver: bridge