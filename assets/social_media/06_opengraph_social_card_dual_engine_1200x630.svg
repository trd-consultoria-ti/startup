<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-og-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <pattern id="pat-losango" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 0 L48 24 L24 48 L0 24 Z" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="24" cy="0" r="1.5" fill="rgba(245,158,11,0.25)"/>
      <circle cx="0" cy="24" r="1.5" fill="rgba(245,158,11,0.25)"/>
    </pattern>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-og-card)"/>
  <rect width="1200" height="630" fill="url(#pat-losango)"/>
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Header Row -->
  <!-- Lockup Top Left -->
  <g transform="translate(60, 48) scale(0.65)">
    <g fill="#F8FAFC">
      <polygon points="0.00,57.75 0.00,165.74 93.50,111.75 93.50,3.75"/>
      <polygon points="200.00,57.75 106.50,3.75 106.50,111.75 200.00,165.74"/>
      <polygon points="100.00,231.00 193.51,177.00 100.00,123.01 6.49,177.00"/>
    </g>
  </g>
  <g transform="translate(205, 58)">
    <text x="0" y="38" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#F8FAFC">TRD</text>
    <text x="2" y="66" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#F59E0B">CONSULTORIA &amp; SERVIÇOS DE TI</text>
  </g>

  <!-- Top Right Credential Badges -->
  <g transform="translate(770, 52)">
    <rect width="370" height="44" rx="8" fill="#111B30" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="24" cy="22" r="5" fill="#F59E0B"/>
    <text x="40" y="27" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">CERTIFICAÇÃO OFICIAL ANTHROPIC (CLAUDE API)</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="180" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#F8FAFC" letter-spacing="-0.5">Sistemas Sob Medida &amp; Sustentação com SLA</text>
  <text x="60" y="222" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">Boutique Sênior de Engenharia: Software rápido sem mensalidade por usuário e retaguarda de missão crítica.</text>

  <!-- Dual Pillar Feature Cards -->
  <!-- Card Left: Sistemas Sob Medida -->
  <g transform="translate(60, 252)" filter="url(#card-shadow)">
    <rect width="525" height="235" rx="14" fill="#0E172B" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Pill Tag -->
    <rect x="24" y="22" width="200" height="28" rx="6" fill="rgba(245,158,11,0.15)"/>
    <text x="36" y="41" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1" fill="#F59E0B">SISTEMAS SOB MEDIDA (NOVO)</text>

    <text x="24" y="85" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">CRM, Hub de Gestão &amp; Portais</text>
    <text x="24" y="112" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F59E0B">Entrega ágil em 2 a 4 semanas · Até 12x no cartão</text>

    <text x="24" y="148" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">✓ Código 100% seu (Lei 9.609/98) — sem lock-in</text>
    <text x="24" y="174" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">✓ Zero mensalidade por usuário de SaaS de prateleira</text>
    <text x="24" y="200" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">✓ Stack moderna: Next.js, React, Tailwind &amp; PostgreSQL</text>
  </g>

  <!-- Card Right: Sustentação & SLA -->
  <g transform="translate(615, 252)" filter="url(#card-shadow)">
    <rect width="525" height="235" rx="14" fill="#0E172B" stroke="#334155" stroke-width="1.5"/>
    <!-- Pill Tag -->
    <rect x="24" y="22" width="230" height="28" rx="6" fill="rgba(56,189,248,0.12)"/>
    <text x="36" y="41" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1" fill="#38BDF8">SUSTENTAÇÃO &amp; CONFIABILIDADE</text>

    <text x="24" y="85" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">SLA P1 Contratual em até 2 Horas</text>
    <text x="24" y="112" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#38BDF8">Retaguarda N3 &amp; Resgate de Sistemas Legados</text>

    <text x="24" y="148" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">✓ Intervenção cirúrgica contra deadlocks e lentidão</text>
    <text x="24" y="174" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">✓ Monitoramento proativo de disponibilidade e banco SQL</text>
    <text x="24" y="200" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">✓ Engenharia sênior dedicada sem intermediários</text>
  </g>

  <!-- Bottom Trust Bar -->
  <g transform="translate(60, 520)">
    <text x="0" y="28" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#64748B">GOVERNANÇA &amp; EXPERIÊNCIA COMPROVADA:</text>

    <!-- Badges Row -->
    <g transform="translate(320, 0)">
      <rect width="235" height="46" rx="8" fill="#0D1527" stroke="#1E293B" stroke-width="1.2"/>
      <g transform="translate(16, 15)"><g fill="#F59E0B"><path d="M8 1 L1 5 L15 5 Z M2 6 L4 6 L4 12 L2 12 Z M6 6 L8 6 L8 12 L6 12 Z M10 6 L12 6 L12 12 L10 12 Z M0 13 L16 13 L16 15 L0 15 Z"/></g></g>
      <text x="42" y="28" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Min. da Justiça (MJSP)</text>

      <rect x="250" width="235" height="46" rx="8" fill="#0D1527" stroke="#1E293B" stroke-width="1.2"/>
      <g transform="translate(266, 15)"><g fill="#F59E0B"><rect x="1" y="2" width="14" height="11" rx="1.5" fill="none" stroke="#F59E0B" stroke-width="1.3"/><line x1="1" y1="5.5" x2="15" y2="5.5" stroke="#F59E0B" stroke-width="1.3"/><rect x="3" y="8" width="3" height="2" fill="#F59E0B"/></g></g>
      <text x="292" y="28" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Serasa Experian</text>

      <rect x="500" width="135" height="46" rx="8" fill="#0D1527" stroke="#1E293B" stroke-width="1.2"/>
      <g transform="translate(516, 15)"><g fill="#F59E0B"><rect x="2" y="7" width="3" height="7" rx="0.5"/><rect x="6.5" y="4" width="3" height="10" rx="0.5"/><rect x="11" y="1" width="3" height="13" rx="0.5"/></g></g>
      <text x="542" y="28" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">CVM</text>

      <rect x="650" width="110" height="46" rx="8" fill="#0D1527" stroke="#1E293B" stroke-width="1.2"/>
      <text x="18" y="28" transform="translate(650,0)" font-family="Arial, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">SENAR</text>
    </g>
  </g>
</svg>
