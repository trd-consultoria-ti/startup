<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <!-- TRD Consultoria e Serviços de TI - Versão Oficial Fundo Claro -->
  <g transform="translate(45, 25)">
    <!-- Símbolo Cubo Isométrico Oficial -->
    <g id="keystone-symbol">
      <polygon points="85,8 162,52 85,96 8,52" fill="#080D1A"/>
      <polygon points="8,63 76,102 76,168 8,129" fill="#080D1A"/>
      <polygon points="94,102 162,63 162,129 94,168" fill="#080D1A"/>
    </g>

    <!-- Bloco Tipográfico Oficial -->
    <g id="typography" transform="translate(220, 0)">
      <!-- Linha 1: TRD -->
      <text x="0" y="100" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="105" 
            font-weight="900" 
            letter-spacing="5" 
            fill="#080D1A">TRD</text>

      <!-- Linha 2: CONSULTORIA & SERVIÇOS DE TI -->
      <text x="2" y="152" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="22" 
            font-weight="600" 
            letter-spacing="10.5" 
            fill="#080D1A">CONSULTORIA &amp; SERVIÇOS DE TI</text>
    </g>
  </g>
</svg>